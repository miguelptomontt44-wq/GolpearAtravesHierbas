name: AtravesarPlantas
version: '${project.version}'
main: dev.atravesarplantas.AtravesarPlantas
api-version: '26.1'
description: Permite golpear mobs e interactuar con cofres y entidades a traves de pasto, flores y plantas.
authors: [AtravesarPlantas]

commands:
  atravesarplantas:
    description: Recarga la configuracion del plugin.
    usage: /atravesarplantas reload
    aliases: [ap]
    permission: atravesarplantas.admin

permissions:
  atravesarplantas.use:
    description: Permite golpear mobs a traves de plantas.
    default: true
  atravesarplantas.interact:
    description: Permite abrir cofres e interactuar con entidades a traves de plantas.
    default: true
  atravesarplantas.admin:
    description: Permite recargar la configuracion.
    default: op
